<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>霓虹猎手 · 数值原型 v0.1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --cyan:#00F0FF; --magenta:#FF2A6D; --bg:#0a0e17; --panel:#111827;
    --dim:#8b95a7; --gold:#FFD166;
  }
  body { background:var(--bg); color:#e6edf3; font-family:"PingFang SC","Microsoft YaHei",sans-serif;
         max-width:960px; margin:0 auto; padding:12px; user-select:none;
         -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
         touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  h1 { font-size:20px; letter-spacing:2px; color:var(--cyan); text-shadow:0 0 12px var(--cyan); }
  h1 span { color:var(--magenta); text-shadow:0 0 12px var(--magenta); }
  .tag { font-size:11px; color:var(--dim); margin:2px 0 12px; }

  /* 战斗区（v1.10：工业楼层背景，地面线 77.8% 高度处对齐脚底） */
  #arena { position:relative; height:280px; background:url('assets/arena-bg.webp') center/cover;
           border:1px solid #1e2a44; border-radius:12px; overflow:hidden; margin-bottom:12px; }
  /* v2.16：楼层数醒目化（左上大号发光）+ 资源 HUD（中上方） */
  #floorLabel { position:absolute; top:10px; left:14px; text-align:left; color:#e6edf3;
                text-shadow:0 1px 4px #000; }
  #floorLabel .fl-big { font-size:22px; font-weight:700; letter-spacing:1px;
                        text-shadow:0 0 10px rgba(0,240,255,.5); }
  #floorLabel .fl-big b { color:var(--cyan); font-size:26px; }
  #floorLabel .fl-sub { font-size:10px; color:#8b95a7; margin-top:2px; }
  #resHud { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:2;
            display:flex; gap:14px; background:rgba(10,14,23,.72); border:1px solid #1e2a44;
            border-radius:20px; padding:5px 16px; font-size:14px; backdrop-filter:blur(2px); }
  #resHud .rg { color:var(--gold); font-weight:700; }
  #resHud .rs { color:#c07bff; font-weight:700; }
  .fighter { position:absolute; bottom:56px; width:64px; height:96px; transition:transform .12s; }
  #player { left:22%; }
  #enemy  { right:22%; }
  .body { position:absolute; inset:0; border-radius:10px 10px 4px 4px; }
  #player .body { background:linear-gradient(180deg,#0e3a44,#062a33); border:2px solid var(--cyan);
                  box-shadow:0 0 18px rgba(0,240,255,.55); }
  #enemy .body { background:linear-gradient(180deg,#3a0e22,#33061a); border:2px solid var(--magenta);
                 box-shadow:0 0 18px rgba(255,42,109,.55); }
  #enemy.boss .body { border-width:3px; box-shadow:0 0 30px var(--magenta); }
  .eye { position:absolute; top:18px; width:10px; height:6px; border-radius:3px; }
  #player .eye { background:var(--cyan); right:12px; box-shadow:0 0 8px var(--cyan); }
  #enemy .eye { background:var(--magenta); left:12px; box-shadow:0 0 8px var(--magenta); }
  .lunge-p { transform:translateX(46px); }
  .lunge-e { transform:translateX(-46px); }
  /* v1.9：佣兵精灵图主角（gunner-sprites-v2 素材包，128px 帧条） */
  #player { width:110px; height:110px; bottom:46px; }
  #player .body, #player .eye { display:none; }
  .psprite { position:absolute; inset:0; image-rendering:pixelated; transform-origin:bottom center;
             background:url('assets/gunner_idle.png') 0 0/400% 100% no-repeat;
             animation:gunnerIdle 1s steps(4) infinite; }
  /* v1.9.2：steps() 动画必须用 px 位移（百分比定位×steps 会按错误步长切片，角色横移） */
  @keyframes gunnerIdle { from{background-position-x:0} to{background-position-x:-440px} }
  .psprite.atk { background-image:url('assets/gunner_shoot.png'); background-size:1600% 100%;
                 animation:gunnerShoot .32s steps(16) 1; }
  @keyframes gunnerShoot { from{background-position-x:0} to{background-position-x:-1760px} }
  .fighter.hit .psprite { filter:brightness(2.6); }
  /* v2.38：玩家死亡动画（阶段01·初始猎手，8 帧~0.9s 保持末帧） */
  #player .psprite.death { background-image:url('assets/stage01-death.png'); background-size:880px 110px;
    background-position:0 0; animation:gunnerDeath .9s steps(7) forwards; }
  @keyframes gunnerDeath { from{background-position-x:0} to{background-position-x:-770px} }
  /* v2.37：光学迷彩——掠食者微光（容器级，不干扰精灵动画） */
  .fighter.cloaked { animation:cloakPulse 1.2s ease-in-out infinite; }
  @keyframes cloakPulse {
    0%,100% { opacity:.45; filter:drop-shadow(0 0 6px #16E6F5) saturate(.7); }
    50%     { opacity:.75; filter:drop-shadow(0 0 14px #16E6F5) saturate(1.1); }
  }
  /* v2.1：跑步动画 + 楼层转场 */
  .psprite.run { background-image:url('assets/gunner_run.png'); background-size:800% 100%;
                 animation:gunnerRun .667s steps(8) infinite; }
  @keyframes gunnerRun { from{background-position-x:0} to{background-position-x:-880px} }
  .bgSlide { position:absolute; top:0; bottom:0; left:0; width:100%; z-index:1;
             background-position:center; background-size:cover; transition:left .45s ease-in-out; }
  .fighter, .hpbar, .hptext, #floorLabel, #mobProgress { z-index:2; }
  /* v2.5：安保兵敌人精灵图（待机/射击/受击/死亡四组） */
  #enemy { width:110px; height:110px; bottom:46px; }
  #enemy .body, #enemy .eye { display:none; }
  .esprite { position:absolute; inset:0; image-rendering:pixelated; transform-origin:bottom center;
             background:url('assets/security_idle.png') 0 0/400% 100% no-repeat;
             animation:secIdle 1s steps(4) infinite; }
  @keyframes secIdle { from{background-position-x:0} to{background-position-x:-440px} }
  #enemy.boss .esprite { transform:scale(1.4); filter:drop-shadow(0 0 12px rgba(255,42,109,.8)); }
  .esprite.shoot { background-image:url('assets/security_shoot.png'); background-size:800% 100%;
                   animation:secShoot .333s steps(8) 1; }
  @keyframes secShoot { from{background-position-x:0} to{background-position-x:-880px} }
  .esprite.hurt { background-image:url('assets/security_hurt.png'); background-size:300% 100%;
                  animation:secHurt .2s steps(3) 1; }
  @keyframes secHurt { from{background-position-x:0} to{background-position-x:-330px} }
  .esprite.die { width:165px; left:-13px; background-image:url('assets/security_death.png');
                 background-size:990px 110px; animation:secDie .6s steps(5) forwards; }
  @keyframes secDie { from{background-position-x:0} to{background-position-x:-825px} }
  /* v2.5：敌人跑入 */
  .esprite.run { background-image:url('assets/security_run.png'); background-size:800% 100%;
                 animation:secRun .667s steps(8) infinite; }
  @keyframes secRun { from{background-position-x:0} to{background-position-x:-880px} }
  /* v2.7：重装典狱长 Boss（165×124 帧，内建 1.5× 体型，覆盖小兵帧条） */
  #enemy.boss { width:165px; height:124px; bottom:42px; }
  #enemy.boss .esprite { transform:none; filter:drop-shadow(0 0 12px rgba(255,42,109,.8));
                         background-image:url('assets/warden_idle.png'); background-size:400% 100%;
                         animation:wardenIdle 1s steps(4) infinite; }
  @keyframes wardenIdle { from{background-position-x:0} to{background-position-x:-660px} }
  #enemy.boss .esprite.shoot { background-image:url('assets/warden_shoot.png'); background-size:800% 100%;
                               animation:wardenShoot .4s steps(8) 1; }
  @keyframes wardenShoot { from{background-position-x:0} to{background-position-x:-1320px} }
  #enemy.boss .esprite.hurt { background-image:url('assets/warden_idle.png'); background-size:400% 100%;
                              animation:wardenIdle 1s steps(4) infinite; }  /* Boss 无受击帧，保持待机 */
  #enemy.boss .esprite.run { width:100%; left:0; background-image:url('assets/warden_run.png');
                             background-size:800% 100%; animation:wardenRun .8s steps(8) infinite; }
  @keyframes wardenRun { from{background-position-x:0} to{background-position-x:-1320px} }
  #enemy.boss .esprite.die { width:100%; left:0; background-image:url('assets/warden_death_v2.png');
                             background-size:800% 100%; animation:wardenDie .8s steps(7) forwards; }
  @keyframes wardenDie { from{background-position-x:0} to{background-position-x:-1155px} }
  /* v2.9：监察官·棱镜（里程碑层 Boss，10/20/30…层），150px 方帧，白金悬浮体型 */
  #enemy.prism { width:150px; height:150px; bottom:46px; }
  #enemy.prism .esprite { background-image:url('assets/prism_idle.png'); background-size:400% 100%;
                          animation:prismIdle 1s steps(4) infinite;
                          filter:drop-shadow(0 0 14px rgba(192,123,255,.7)); }
  @keyframes prismIdle { from{background-position-x:0} to{background-position-x:-600px} }
  #enemy.prism .esprite.shoot { background-image:url('assets/prism_shoot.png'); background-size:600% 100%;
                                animation:prismShoot .4s steps(6) 1; }
  @keyframes prismShoot { from{background-position-x:0} to{background-position-x:-900px} }
  #enemy.prism .esprite.slash { background-image:url('assets/prism_slash.png'); background-size:600% 100%;
                                animation:prismSlash .5s steps(6) 1; }
  @keyframes prismSlash { from{background-position-x:0} to{background-position-x:-900px} }
  #enemy.prism .esprite.run { width:100%; left:0; background-image:url('assets/prism_move.png');
                              background-size:600% 100%; animation:prismMove .75s steps(6) infinite; }
  @keyframes prismMove { from{background-position-x:0} to{background-position-x:-900px} }
  #enemy.prism .esprite.hurt { background-image:url('assets/prism_idle.png'); background-size:400% 100%;
                               animation:prismIdle 1s steps(4) infinite; }  /* 无受击帧，保持待机 */
  #enemy.prism .esprite.die { width:100%; left:0; background-image:url('assets/prism_death.png');
                              background-size:800% 100%; animation:prismDie .89s steps(7) forwards; }
  @keyframes prismDie { from{background-position-x:0} to{background-position-x:-1050px} }
  /* v2.15：巡猎机械犬（小怪随机种，110×82，体高 45%） */
  #enemy.hound { width:110px; height:82px; bottom:46px; }
  #enemy.hound .esprite { background-image:url('assets/hound_idle.png'); background-size:400% 100%;
                          animation:houndIdle 1s steps(4) infinite; }
  @keyframes houndIdle { from{background-position-x:0} to{background-position-x:-440px} }
  #enemy.hound .esprite.run { background-image:url('assets/hound_run.png'); background-size:800% 100%;
                              animation:houndRun .667s steps(8) infinite; }
  @keyframes houndRun { from{background-position-x:0} to{background-position-x:-880px} }
  #enemy.hound .esprite.bite { background-image:url('assets/hound_bite.png'); background-size:600% 100%;
                               animation:houndBite .5s steps(6) 1; }
  @keyframes houndBite { from{background-position-x:0} to{background-position-x:-660px} }
  #enemy.hound .esprite.shoot { background-image:url('assets/hound_idle.png'); background-size:400% 100%;
                                animation:houndIdle 1s steps(4) infinite; }  /* 犬无射击帧，兜底 */
  #enemy.hound .esprite.hurt { background-image:url('assets/hound_hurt.png'); background-size:300% 100%;
                               animation:houndHurt .2s steps(3) 1; }
  @keyframes houndHurt { from{background-position-x:0} to{background-position-x:-330px} }
  #enemy.hound .esprite.die { width:100%; left:0; background-image:url('assets/hound_death.png');
                              background-size:600% 100%; animation:houndDie .667s steps(5) forwards; }
  @keyframes houndDie { from{background-position-x:0} to{background-position-x:-550px} }
  /* v2.43 Codex：裂爪巡猎蛛，256×192 透明帧条，以 128×96 显示。脚底锚点 (68,84)。 */
  #enemy.spider { width:128px; height:96px; bottom:44px; }
  #enemy.spider .esprite { width:100%; left:0; transform:none; image-rendering:auto;
    background-image:url('assets/riftclaw/idle.webp'); background-size:400% 100%;
    animation:spiderIdle 1.04s steps(4) infinite; }
  @keyframes spiderIdle { from{background-position-x:0} to{background-position-x:-512px} }
  #enemy.spider .esprite.run { background-image:url('assets/riftclaw/walk.webp'); background-size:800% 100%;
    animation:spiderWalk .88s steps(8) infinite; }
  @keyframes spiderWalk { from{background-position-x:0} to{background-position-x:-1024px} }
  #enemy.spider .esprite.shoot { background-image:url('assets/riftclaw/shoot.webp'); background-size:600% 100%;
    animation:spiderShoot .66s steps(1,end) forwards; }
  #enemy.spider .esprite.die { background-image:url('assets/riftclaw/death.webp'); background-size:800% 100%;
    animation:spiderDie 1.41s steps(1,end) forwards; }
  @keyframes spiderShoot {
    0.000000% { background-position-x:0px; }
    18.181818% { background-position-x:-128px; }
    42.424242% { background-position-x:-256px; }
    51.515152% { background-position-x:-384px; }
    63.636364% { background-position-x:-512px; }
    78.787879% { background-position-x:-640px; }
    100% { background-position-x:-640px; }
  }
  @keyframes spiderDie {
    0.000000% { background-position-x:0px; }
    5.673759% { background-position-x:-128px; }
    12.056738% { background-position-x:-256px; }
    19.148936% { background-position-x:-384px; }
    26.241135% { background-position-x:-512px; }
    34.751773% { background-position-x:-640px; }
    44.680851% { background-position-x:-768px; }
    57.446809% { background-position-x:-896px; }
    100% { background-position-x:-896px; }
  }
  /* v2.23：天枢·零号主机（100 层主 Boss，190×142 帧条） */
  #enemy.tianshu { width:190px; height:142px; bottom:40px; }
  #enemy.tianshu .esprite { background-image:url('assets/tianshu_idle.png'); background-size:400% 100%;
                            animation:tsIdle 1s steps(4) infinite; }
  @keyframes tsIdle { from{background-position-x:0} to{background-position-x:-760px} }
  #enemy.tianshu .esprite.run { background-image:url('assets/tianshu_move.png'); background-size:600% 100%;
                                animation:tsMove .6s steps(6) infinite; }
  @keyframes tsMove { from{background-position-x:0} to{background-position-x:-1140px} }
  #enemy.tianshu .esprite.shoot { background-image:url('assets/tianshu_machinegun.png'); background-size:600% 100%;
                                  animation:tsMg .4s steps(6) infinite; }   /* 机枪连射（循环） */
  @keyframes tsMg { from{background-position-x:0} to{background-position-x:-1140px} }
  #enemy.tianshu .esprite.charge { background-image:url('assets/tianshu_charge.png'); background-size:400% 100%;
                                   animation:tsCharge .5s steps(3) forwards; }   /* 蓄力保持末帧=预警 */
  @keyframes tsCharge { from{background-position-x:0} to{background-position-x:-570px} }
  #enemy.tianshu .esprite.cannon { background-image:url('assets/tianshu_cannon.png'); background-size:600% 100%;
                                   animation:tsCannon .5s steps(6) 1; }
  @keyframes tsCannon { from{background-position-x:0} to{background-position-x:-1140px} }
  #enemy.tianshu .esprite.hurt { background-image:url('assets/tianshu_idle.png'); background-size:400% 100%;
                                 animation:tsIdle 1s steps(4) infinite; }   /* 无受击帧（素材规范），兜底待机 */
  #enemy.tianshu .esprite.die { width:100%; left:0; background-image:url('assets/tianshu_death.png');
                                background-size:800% 100%; animation:tsDie .8s steps(7) forwards; }
  @keyframes tsDie { from{background-position-x:0} to{background-position-x:-1330px} }
  .hpbar { position:absolute; bottom:30px; width:180px; height:14px; background:#1a2436;
           border:1px solid #2b3a55; border-radius:7px; overflow:hidden; }
  #playerHp { left:calc(22% - 35px); } #enemyHp { right:calc(22% - 58px); }   /* 静态兜底（实际位置由 renderCombat 按容器中心实时对齐，v2.24.13） */
  /* v2.18：护盾独立细横条（血条上方，无盾时隐藏） */
  .shbar { position:absolute; bottom:47px; width:180px; height:8px; background:#141c2c;
           border:1px solid #2b3a55; border-radius:3px; overflow:hidden; display:none; }
  #playerSh { left:calc(22% - 58px); } #enemySh { right:calc(22% - 58px); }
  .shfill { height:100%; transition:width .15s;
            background:linear-gradient(90deg,#7fd4ff,#c07bff); box-shadow:0 0 6px rgba(192,123,255,.6); }
  .shtext { position:absolute; bottom:45px; width:180px; text-align:center; font-size:8px;
            line-height:11px; color:#eaf3ff; text-shadow:0 1px 2px #000; z-index:2; display:none; }
  #playerShT { left:calc(22% - 58px); } #enemyShT { right:calc(22% - 58px); }
  /* v2.20：倍速按钮（战斗区左下角胶囊，首次重塑后可见） */
  #btnSpeed.nh-button { position:absolute; left:14px; bottom:14px; z-index:3; display:none;
              width:auto; min-height:36px; padding:5px 14px; border-radius:18px; font-size:13px; }
  #btnSpeed.on { border-color:var(--cyan)!important; }   /* v2.31.6 */
  /* v2.20：护盾白色光环（贴合轮廓的 drop-shadow 呼吸发光，替代轮扩描边环） */
  .fighter.shielded { animation:auraGlow 1.6s ease-in-out infinite; }
  @keyframes auraGlow {
    0%,100% { filter:drop-shadow(0 0 10px rgba(255,255,255,.75)); }
    50%     { filter:drop-shadow(0 0 22px rgba(255,255,255,1)); } }
  /* v2.54：护盾与迷彩同时存在时合成外观，避免 animation 简写互相覆盖。 */
  .fighter.shielded.cloaked { animation:shieldCloakPulse 1.2s ease-in-out infinite; }
  @keyframes shieldCloakPulse {
    0%,100% { opacity:.45; filter:drop-shadow(0 0 10px rgba(255,255,255,.75)) drop-shadow(0 0 6px #16E6F5) saturate(.7); }
    50%     { opacity:.75; filter:drop-shadow(0 0 22px rgba(255,255,255,1)) drop-shadow(0 0 14px #16E6F5) saturate(1.1); }
  }
  .hpfill { height:100%; transition:width .15s; }
  #playerHp .hpfill { background:linear-gradient(90deg,#00c8d4,var(--cyan)); }
  #enemyHp .hpfill { background:linear-gradient(90deg,#d41e5a,var(--magenta)); }
  .hptext { position:absolute; bottom:31px; width:180px; text-align:center; font-size:10px; color:#fff; z-index:2; }
  #playerHpT { left:calc(22% - 58px); } #enemyHpT { right:calc(22% - 58px); }
  .dmg { position:absolute; font-weight:bold; font-size:15px; pointer-events:none;
         animation:floatUp 0.9s ease-out forwards; text-shadow:0 0 6px currentColor; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-56px);} }
  #mobProgress { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:11px; color:var(--dim); }

  /* 面板 */
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  /* v2.24：移动端适配层（≤640px，桌面零影响） */
  @media (max-width:640px){
    body { padding:8px; padding-top:calc(58vw + 10px); touch-action:manipulation; }   /* v2.24.6：顶部预留 fixed 战斗区高度 */
    /* 顶栏压缩：版本号缩小、按钮紧凑 */
    #topbar h1 { font-size:16px; }
    #topbar .tag { font-size:10px; }
    .tools button { font-size:10px; padding:5px 8px; }
    /* 战斗区按屏宽比例（v2.24.4：56vw 更宽画幅 + 背景按宽撑满不裁横向） */
    #arena { height:58vw; background-size:cover; background-position:center; background-repeat:no-repeat;
             position:fixed; top:0; left:0; right:0; z-index:5; border-radius:0;   /* v2.24.6：fixed 常驻 */
             box-shadow:0 6px 18px rgba(0,0,0,.55); }
    /* v2.34：删掉多余的 }（F04：媒体查询曾提前闭合，手机规则泄漏桌面） */
    /* HUD 缩小贴底（v2.24.3：压到血条组下方，避免干涉） */
    #resHud { top:auto; bottom:2px; font-size:11px; padding:3px 10px; gap:8px; }
    #floorLabel .fl-big { font-size:18px; }
    #floorLabel .fl-big b { font-size:22px; }
    /* 击杀进度挪右上角 */
    #mobProgress { bottom:auto; top:10px; left:auto; right:12px; text-align:right; }
    /* v2.24.3：双方拉开距离（更多场景画幅），血条组跟随 */
    #player { left:8%; } #enemy { right:8%; }
    .hpbar, .shbar, .hptext, .shtext { width:120px; }
    #playerHp,#playerSh,#playerHpT,#playerShT { left:calc(8% - 5px); }
    #enemyHp,#enemySh,#enemyHpT,#enemyShT { right:calc(8% - 5px); }
    /* 面板单列全宽 */
    .row { flex-direction:column; }
    .panel { width:100%; }
    /* 抽屉全屏 */
    #drawer { width:100vw; max-width:100vw; }

<script>
"use strict";
// ============ 数值模型（设计文档 v1.0 锁定参数） ============
const ATK0=8, HP0=100, GROWTH=1.10, COST0=6, COST_G=1.18;   // v2.52 Codex：攻击与生命强化费用同步
const ECONOMY_SCHEMA=1, CRATE_INTERVAL_MS=60000, CRATE_GOLD_MULT=20;

const MOB_HP0=20, MOB_G=1.15, MOB_ATK0=1.5, MOB_ATK_G=1.15, GOLD_R=0.10;   // v2.14：怪攻 1.14→1.15
const BOSS={hp:6, atk:1.8, gold:5};
// v2.25：品质阶梯 10 档——报废/破损垫底，数值整体前移 2 档（前期曲线不变），不朽=虹彩封顶
const QUALITY=["报废","破损","民用","改装","军用","原型","传说","神话","永恒","不朽"];
function qualityName(q){ return QUALITY[Math.min(q,9)]||"不朽"; }   // v2.25：合成封顶不朽，取消无上限
function qClass(q){ return "q"+Math.min(q,9); }
const QCOL=["#3a3f46","#b8c0cc","#3ddc84","#4aa8ff","#c07bff","#ff6b6b","#ffb020","#ff2a6d","#d9fbff","IRIS"];
function multOf(slot,q){ const b=MULT[slot]; return q<=4?b[q]:Math.round(b[4]*Math.pow(1.35,q-4)); }   // v2.0 回调：橙后 1.45→1.35/阶
const SLOT_ICON={weapon:"weapon",implant:"neural",armor:"armor",chip:"chip"};
const SLOT_BUFF={weapon:"攻击",implant:"攻速",armor:"生命",chip:"信用点"};
// v2.3：固定词条（取消随机），同部位同品质完全同构
const FIXED_AFFIX={weapon:"crit",implant:"aspd",armor:"ls",chip:null};
const AFFIX_BASE={crit:5,aspd:10,ls:3}, AFFIX_STEP={crit:1,aspd:2,ls:1};   // v2.25：词条随品质递增（传说 q6 起）
const EARLY_AFFIX={crit:[2,3,4],aspd:[4,6,8],ls:[1,1.5,2]};   // v2.41 Codex：改装/军用/原型弱词条，传说以上沿用原值
const affixOf=(slot,q)=>{
  const t=FIXED_AFFIX[slot];
  if(!t||q<3) return null;
  return {t,v:q<6?EARLY_AFFIX[t][q-3]:AFFIX_BASE[t]+AFFIX_STEP[t]*(q-6)};
};
const SLOTS={weapon:"义体武器",implant:"神经插件",armor:"皮下装甲",chip:"芯片"};
const MULT={weapon:[10,25,45,70,100], implant:[5,10,18,28,40],
            armor:[10,25,45,70,100], chip:[10,20,35,55,80]};
// （DROPS 旧掉落表已于 v1.8 移除，改 dropBand 楼层区间制）
// 10层=常驻属性池 / 5层=条件触发器池；本轮获取的技能重塑清空，阶段自带护盾按阶段派生。
const SKILLS={
  // —— 10 层常驻属性（棱镜核心） ——
  overclock:{n:"战斗超频",d:"暴击率 +10%"},
  fatal:{n:"致命固件",d:"暴击伤害 +50%"},
  neuro:{n:"神经加速",d:"攻速 +15%"},
  fire:{n:"火力协议",d:"攻击 +25%"},
  subdermal:{n:"皮下加固",d:"生命 +30%"},
  nano:{n:"纳米修复",d:"吸血 +5%"},
  shield:{n:"应急护盾",d:"获得10%最大生命护盾"},
  blackmarket:{n:"黑市渠道",d:"信用点 +30%"},
  resonance:{n:"碎片共鸣",d:"Boss 碎片掉落 +10%"},
  // —— 5 层条件触发器（中庭） ——
  adrenaline:{n:"肾上腺素",d:"生命低于 50% 时攻速 +30%"},
  critsurge:{n:"狂暴节奏",d:"暴击后攻速 +30%，持续 5 秒"},
  ghoststep:{n:"光学迷彩",d:"击杀后无敌 2 秒"},
  lowhp:{n:"困兽协议",d:"生命低于 30% 时伤害 +40%"},
  soulrush:{n:"猎手直觉",d:"破盾后攻速 +25%，持续 4 秒"},
};
const POOL_10=["overclock","fatal","neuro","fire","subdermal","nano","shield","blackmarket","resonance"];
const POOL_5=["adrenaline","critsurge","ghoststep","lowhp","soulrush"];
// 以实际通关的奖励层数为准，不能用已推进的当前层或旧存档池标记覆盖。
function skillPoolForFloor(floor){
  if(!Number.isSafeInteger(floor)||floor<1)return null;
  return floor%10===0?"p10":floor%10===5?"p5":null;
}
const TRIGGER_KEYS=new Set(POOL_5);   // 触发型标记（面板 ⚡ 标注）
const TREE={
  dmg:{n:"伤害增幅",per:"+5% 伤害/级"},
  gold:{n:"信用点优化",per:"+10% 信用点/级"},
  soul:{n:"灵魂共鸣",per:"+10% 重塑碎片/级"},   // v2.0：碎片提升碎片获得
};   // v2.0：全部无上限，成本=等级+1 线性（多项式收入追指数怪血，不失控）
const TREE_PCT={dmg:5,gold:10,soul:10};   // v2.21：离线协议分支删除

// ============ 状态 ============
let S;
// v2.51：本地测试工具。发行构建设为 false；倍率仅保留本次页面会话。
const TEST_TOOLS_ENABLED=true;
let testSpeed=1, combatTick=0, combatRemainder=0;
const COMBAT_STEP=1/60;
const combatNow=()=>combatTick*1000/60;
// 技能时钟只在双方可战斗时前进，演出/日志仍使用原游戏时钟。
let skillTick=0, enemyEntering=false;
const skillNow=()=>skillTick*1000/60;
// 装饰随机不消耗掉落/暴击随机序列，视觉限流不改变战斗结果。
let visualSeed=123456789;
function visualRandom(){visualSeed=(Math.imul(visualSeed,1664525)+1013904223)>>>0;return visualSeed/4294967296;}
const fxLast={player:-Infinity,enemy:-Infinity,floatPlayer:-Infinity,floatEnemy:-Infinity};
function allowFastEffect(key){
  if(effSpeed()<4) return true;
  const now=performance.now();if(now-fxLast[key]<70)return false;fxLast[key]=now;return true;
}
// 五阶段基础值是绝对值；阶段内重塑不改变阶段。
const STAGES=[null,
  {name:"初始猎手",atk:8,hp:100,shootMs:320}, {name:"肢体替换",atk:12,hp:150,shootMs:320},
  {name:"躯干重构",atk:16,hp:200,shootMs:320}, {name:"神经融合",atk:24,hp:300,shootMs:400},
  {name:"全身义体",atk:32,hp:400,shootMs:560}];
const STAGE_SCHEMA=2;
const stageConfig=()=>STAGES[S.stage||1];
const stageShieldLevel=(stage=S.stage||1)=>stage-1; // v2.53：阶段2–5自带Lv.1–4，不写入局内技能存档
let saveBlocked=false;
function validateStageSave(d){
  if(!d||typeof d!=="object"||!Number.isSafeInteger(d.floor)||d.floor<1) throw Error("存档楼层无效");
  if(d.stageSchema!==undefined&&d.stageSchema!==STAGE_SCHEMA) throw Error("不支持的阶段存档版本");
  if(d.stage!==undefined&&(!Number.isInteger(d.stage)||d.stage<1||d.stage>5)) throw Error("阶段数据无效");
  const u=d.stageUpgrade;
  if(u&&(!["clear","playing","complete"].includes(u.status)||!Number.isInteger(u.from)||u.from<1||u.from>4||u.to!==u.from+1||
      typeof u.id!=="string"||!Number.isFinite(u.elapsed)||u.elapsed<0||u.elapsed>8||
      d.stage!==(u.status==="clear"?u.from:u.to)||
      (u.status==="complete"&&u.elapsed!==8))) throw Error("改装恢复数据无效");
}
// v2.57：旧键保留为无尽档；页面生命周期固定模式，跨标签页也不改写另一模式。
const MODE_NAMES={endless:"无尽模式",build:"构筑模式"};
function readModePrefs(){
  const raw=localStorage.getItem("neonHunterModes");
  if(!raw) return {schema:1,selected:"endless",buildUnlocked:false};
  const d=JSON.parse(raw);
  if(!d||d.schema!==1||!Object.hasOwn(MODE_NAMES,d.selected)||typeof d.buildUnlocked!=="boolean") throw Error("模式配置暂不可读取");
  return d;
}
function endlessReachedFive(){
  try{
    const d=JSON.parse(localStorage.getItem("neonHunter"));validateStageSave(d);
    return d.stage===5&&(!d.mode||d.mode==="endless");
  }catch(e){return false;}
}
function buildUnlocked(){
  try{if(readModePrefs().buildUnlocked)return true;}catch(e){}
  return endlessReachedFive();
}
function initialMode(){
  try{const d=readModePrefs();return d.selected==="build"&&buildUnlocked()?"build":"endless";}catch(e){return "endless";}
}
let gameMode=initialMode();
const saveKey=(mode=gameMode)=>mode==="build"?"neonHunter.build":"neonHunter";
const logKey=()=>gameMode==="build"?"neonHunterLogs.build":"neonHunterLogs";
function writeModePrefs(selected){
  try{
    const d=readModePrefs(),unlocked=d.buildUnlocked||endlessReachedFive();
    if(!Object.hasOwn(MODE_NAMES,selected)||(selected==="build"&&!unlocked))return false;
    localStorage.setItem("neonHunterModes",JSON.stringify({...d,selected,buildUnlocked:unlocked}));return true;
  }catch(e){return false;}
}
function rememberBuildUnlock(){
  if(gameMode!=="endless"||S.stage!==5)return;
  try{
    const d=readModePrefs();
    if(!d.buildUnlocked&&endlessReachedFive())localStorage.setItem("neonHunterModes",JSON.stringify({...d,buildUnlocked:true}));
  }catch(e){} // 已提交的阶段五存档仍是解锁凭据；后续保存/切换会重试。
}
function selectMode(mode){
  if(boot.phase!=="cover"||hasGameModal()||mode===gameMode)return false;
  if(!Object.hasOwn(MODE_NAMES,mode)||(mode==="build"&&!buildUnlocked()))return false;
  if(!saveBlocked&&!save())return false;
  if(!writeModePrefs(mode)){toast("模式选择保存失败，请检查浏览器存储后重试。");return false;}
  window.location.reload();return true;
}
function returnToCover(){
  if(boot.phase!=="playing"||stageBusy()||hasGameModal()||adLock)return false;
  if(!save())return false;
  // 其他标签页可能更改过选择；返回时仍展示本页的模式。
  if(!writeModePrefs(gameMode)){toast("模式选择保存失败，请稍后重试。");return false;}
  saveLogs(true);window.location.reload();return true;
}
function renderModeCover(){
  const unlocked=buildUnlocked();
  for(const [mode,id] of [["endless","modeEndless"],["build","modeBuild"]]){
    $(id).setAttribute?.("aria-pressed",String(mode===gameMode));
    $(id).classList.toggle("selected",mode===gameMode);
  }
  $("modeBuild").disabled=!unlocked;
  $("buildIcon").innerHTML=unlocked?"▦":'<svg viewBox="0 0 48 48" width="36" height="36" fill="currentColor"><path d="M14 20v-6a10 10 0 0 1 20 0v6h3v24H11V20zm5 0h10v-6a5 5 0 0 0-10 0zm3 9v7h4v-7z"/></svg>';
  $("buildBadge").hidden=!unlocked;
  $("buildHint").textContent=unlocked?"5层触发型 · 10层属性型":"无尽模式进入阶段五后解锁";
  $("btnStart").innerHTML=`进入${MODE_NAMES[gameMode]}<small>阶段 ${S.stage} · 第 ${S.floor} 层</small>`;
  $("btnStart").onclick=()=>startCoverLoad();
  if(saveBlocked){
    $("btnStart").innerHTML="存档暂不可读取<small>原始存档已保留 · 点击导出备份</small>";
    $("btnStart").onclick=()=>{
      try{download(`neon-hunter-${gameMode}-backup.json`,localStorage.getItem(saveKey())||"","application/json");}
      catch(e){toast("暂时无法读取备份，请检查浏览器存储权限。");}
    };
  }
}
function writeStageState(next){
  if(saveBlocked) return false;
  try{localStorage.setItem(saveKey(),JSON.stringify(next));S=next;rememberBuildUnlock();return true;}
  catch(e){return false;}
}
function freshState(){ return {
  mode:gameMode,
  economySchema:ECONOMY_SCHEMA, crateCooldownMs:CRATE_INTERVAL_MS,
  stageSchema:STAGE_SCHEMA, stage:1, stageHistory:[], stageUpgrade:null, legacyUpgradeEligible:false,
  gold:0, atkLv:0, hpLv:0, floor:1, maxFloor:1, mobIdx:0,
  v:1, souls:0, runSouls:0, tree:{dmg:0,gold:0,soul:0}, prestiges:0, bestEver:0, speed2:false, sfxOn:true, cratesRun:0,
  equip:{weapon:null,implant:null,armor:null,chip:null},
  prestigeOffer:null, lastPrestigeMilestone:0, lastPrestigeId:null,
  inv:[], skills:[], pity:0, crateReady:Date.now(), lastSave:Date.now(),
};}
let barsHidden=false;   // v2.31.4：血条组隐藏状态（护盾条显隐与血条一致，renderCombat 不再每帧强写）
function save(){
  if(saveBlocked) return false;
  S.lastSave=Date.now();   // v2.32：血量快照退役（读档=新层起点）
  try{ localStorage.setItem(saveKey(), JSON.stringify(S)); rememberBuildUnlock(); saveLogs(false); return true; }
  catch(e){ toast("存档写入失败（存储空间不足）"); return false; }   // v2.29：存储异常隔离，不中断主循环
}
const SAVE_V=1;   // v2.29：存档版本标记——历史迁移只在旧档执行一次（修每次读档 q+2）
function load(){
  saveBlocked=false;
  try{ const raw=localStorage.getItem(saveKey()), d=JSON.parse(raw); if(d) {
    validateStageSave(d);
    if(d.mode!==undefined&&d.mode!==gameMode)throw Error("存档模式不匹配");
    if(d.economySchema===undefined){
      // 旧档没有在线冷却，不能从旧时间戳补发离线补给；只初始化冷却，保留已获资源。
      localStorage.setItem(saveKey()+".preEconomy",raw);
      d.economySchema=ECONOMY_SCHEMA;d.crateCooldownMs=CRATE_INTERVAL_MS;
    }else if(d.economySchema!==ECONOMY_SCHEMA||!Number.isFinite(d.crateCooldownMs)||d.crateCooldownMs<0||d.crateCooldownMs>CRATE_INTERVAL_MS){
      throw Error("补给存档数据无效");
    }
    if(!d.stageSchema){
      // 先备份再迁移；升级前保留所有资源及待处理选择，不推算多次改装。
      localStorage.setItem(saveKey()+".preStages",raw);
      d.stage=1; d.stageSchema=STAGE_SCHEMA;
      d.legacyUpgradeEligible=d.floor>100||d.maxFloor>=100||d.prestigeOffer?.floor>=100||d.pendingOffer?.floor>=100;
    }
    S=Object.assign(freshState(),d);
    S.tree=Object.assign({dmg:0,gold:0,soul:0},S.tree); delete S.tree.offline;   // v2.21：旧档 offline 字段清除
    S.skills=(S.skills||[]).filter(k=>SKILLS[k]);   // v2.24.14：已删技能静默剔除
    [...S.inv,...Object.values(S.equip).filter(Boolean)].forEach(it=>{
      if(!d.v) it.q=Math.min((it.q||0)+2,9);   // v2.29：品质 +2 迁移仅限未标记旧档（幂等）
      it.affix=affixOf(it.slot,it.q);
    });
    S.stageHistory=Array.isArray(S.stageHistory)?S.stageHistory:[];
    S.v=SAVE_V; S.mode=gameMode; rememberBuildUnlock();
    S.mobIdx=0; S.playerHp=null;   // v2.32：读档=回本层起点（收益不回退）
    return true; } }catch(e){saveBlocked=true;}
  S=freshState(); return false;
}

// ============ 五阶段：百层结算与一次性升阶 ============
function stageBusy(){return Boolean(S.stageUpgrade)||saveBlocked;}
function queueStageClear(legacy=false){
  if(S.stage>=5||S.stageUpgrade||S.prestigeOffer||S.pendingOffer) return false;
  S.stageUpgrade={id:`stage:${S.stage}:${Date.now()}`,from:S.stage,to:S.stage+1,status:"clear",elapsed:0,legacy};
  paused=true; pendingTransit=false; save(); return true;
}
function resumeLegacyUpgrade(){
  if(!S.legacyUpgradeEligible||S.stageUpgrade||S.prestigeOffer||S.pendingOffer) return false;
  if(queueStageClear(true)){showStageUpgrade();return true;}return false;
}
function commitStageUpgrade(){
  const u=S.stageUpgrade;
  if(!u||u.status!=="clear"||u.from!==S.stage||u.to!==S.stage+1||u.to>5) return false;
  const next={...freshState(),stage:u.to,sfxOn:S.sfxOn,speed2:S.speed2,
    stageHistory:[...S.stageHistory,{from:u.from,to:u.to,id:u.id,at:Date.now(),bestFloor:S.bestEver}],
    stageUpgrade:{...u,status:"playing",elapsed:0},lastStageUpgradeId:u.id};
  if(!writeStageState(next)){stageMessage("存档写入失败，资源尚未清空。请释放存储空间后重试。");return false;}
  clearDropNotice();
  beginPresentationRun(); prestigeAd=null;prestigeAdSerial++;adRelease();
  confirmOpen=false;pendingSkillOffer=null;skillOfferOpen=false;curOffer=[];
  lastOfferPool=null;lastOfferFloor=null;pendingTransit=false;transit=false;wall=false;paused=true;
  buff={adrenaline:0,critsurge:0,soulrush:0};player={hp:calcStats().hp,shield:0,pendingInvuln:0,invulnUntil:0};
  atkTimer=0;floorGoldEarned=0;dispFloor=1;speedDropNotified=false;
  $("player").classList.remove("cloaked","shielded");$("playerSpr").classList.remove("death","atk","run");
  $("player").setAttribute?.("data-stage",String(S.stage));
  logEvent("stage_upgrade",{from:u.from,to:u.to,settlementId:u.id});
  showStageUpgrade();renderPanels();return true;
}
function completeStageAnimation(){
  const u=S.stageUpgrade;
  if(!u||u.status!=="playing"||stageClock.id!==u.id||stageClock.elapsed<8) return false;
  const next={...S,stageUpgrade:{...u,status:"complete",elapsed:8},lastSave:Date.now()};
  if(!writeStageState(next)){
    stageMessage("演出已完成，存档写入失败。请释放存储空间后重试。");
    $("stageActions").innerHTML=prestigeButton("upgrade","completeStageAnimation()","重试保存","保存后继续");return false;
  }
  logEvent("stage_animation_complete",{stage:S.stage});showStageUpgrade();return true;
}
function enterNextStage(){
  if(S.stageUpgrade?.status!=="complete") return false;
  if(!writeStageState({...S,stageUpgrade:null,lastSave:Date.now()})){
    stageMessage("存档写入失败，请释放存储空间后重试。");return false;
  }
  $("stageOverlay").hidden=true;document.body.classList.remove("stage-active");setStageInert(false);
  spawnMob();openingRunIn();renderPanels();return true;
}

// 独立于战斗倍速：只累计前台实际呈现时间；每半秒保存可恢复播放点。
let stageClock={id:null,elapsed:0,last:null,savedAt:0,raf:null};
function setStageInert(on){
  for(const id of ["topbar","arena","panels","drawer","overlay"]){const e=$(id);if(e)e.inert=on;}
}
function stageMessage(text){$("stageMessage").textContent=text;}
function stagePortrait(n){
  const url=n===1?"assets/gunner_idle.png":`assets/stages/stage0${n}-idle.png`;
  return `<div class="stage-portrait" style="background-image:url('${url}')" role="img" aria-label="${STAGES[n].name}"></div>`;
}
function stageSteps(n){return `<ol class="stage-steps">${STAGES.slice(1).map((c,i)=>`<li class="${i+1<=n?"reached":""}" ${i+1===n?'aria-current="step"':''}><b>${i+1}</b><span>${c.name}</span></li>`).join("")}</ol>`;}
function showStageUpgrade(){
  if(deferForCrate(4,()=>showStageUpgrade()))return;

const presentationTasks=new Set(), presentationTweens=new Set(), sceneLayers=new Set();
let presentationRate=1, deathWait=null, presentationSuspended=Boolean(document.hidden);
function cancelPresentation(task){
  if(!task) return;
  clearTimeout(task.timer); presentationTasks.delete(task);
}
function armPresentation(task){
  task.started=performance.now(); task.rate=presentationRate;
  if(presentationSuspended)return;
  task.timer=setTimeout(()=>{
    if(document.hidden||crateAd){setPresentationHidden(document.hidden);return;}
    presentationTasks.delete(task);
    if(task.seq===runSeq) task.fn();
  },Math.max(0,task.remaining/task.rate));
}
function afterPresentation(ms,fn,seq=runSeq){
  syncPresentationSpeed();
  const task={remaining:ms,fn,seq}; presentationTasks.add(task); armPresentation(task); return task;
}
function syncPresentationSpeed(){
  const rate=effSpeed(), now=performance.now();
  if(rate!==presentationRate){
    presentationRate=rate;
    for(const task of presentationTasks){
      clearTimeout(task.timer);
      if(task.seq!==runSeq){ presentationTasks.delete(task); continue; }
      if(!presentationSuspended)task.remaining=Math.max(0,task.remaining-(now-task.started)*task.rate);
      armPresentation(task);
    }
  }
  for(const id of ["playerSpr","enemySpr"]){
    const el=$(id);
    if(el&&el.getAnimations) for(const anim of el.getAnimations()){
      const target=presentationSuspended?0:rate;
      if(anim.playbackRate!==target) anim.playbackRate=target;
    }
  }
  for(const item of presentationTweens){
    if(item.seq!==runSeq){ item.anim.cancel(); presentationTweens.delete(item); }
    else if(item.anim.playbackRate!==(presentationSuspended?0:rate)) item.anim.playbackRate=presentationSuspended?0:rate;
  }
}
function setPresentationHidden(hidden){
  hidden=hidden||Boolean(crateAd); // 补给广告与后台分别持有暂停，任何一方未解除都不恢复
  if(hidden===presentationSuspended)return;
  const now=performance.now();
  if(hidden){
    for(const task of presentationTasks){clearTimeout(task.timer);task.remaining=Math.max(0,task.remaining-(now-task.started)*task.rate);}
    presentationSuspended=true;
  }else{
    presentationSuspended=false;
    for(const task of presentationTasks)armPresentation(task);
  }
  syncPresentationSpeed();lastT=now;combatRemainder=0;
}
function presentationTween(el,prop,to,ms,seq=runSeq,easing="linear"){
  const from=getComputedStyle(el)[prop]||el.style[prop];
  for(const item of presentationTweens) if(item.el===el&&item.prop===prop){
    item.anim.cancel(); cancelPresentation(item.task); presentationTweens.delete(item);
  }
  el.style.transition="none"; el.style[prop]=to;
  if(!el.animate) return;   // 无动画 API 的环境仍按演出时钟推进逻辑
  const anim=el.animate([{[prop]:from},{[prop]:to}],{duration:ms,easing,fill:"both"});
  anim.playbackRate=presentationSuspended?0:effSpeed();
  const item={el,prop,anim,seq}; presentationTweens.add(item);
  item.task=afterPresentation(ms,()=>{ anim.cancel(); presentationTweens.delete(item); },seq);
}
function cancelDeathWait(){
  if(!deathWait) return;
  const d=deathWait; deathWait=null; cancelPresentation(d.task);
  if(d.spr.removeEventListener) d.spr.removeEventListener("animationend",d.listener);
}
function beginPresentationRun(){
  enemyEntering=false;

  presentationTasks.clear();

  presentationTweens.clear();

}

function rollQuality(f){

  // v2.0 数值回调：最高档降权（紫 13→8 / 橙 13→6 / f75+ 橙 35→20），合成链才是主通道
  const w=hi-lo===2?({2:[60,30,10],3:[60,32,8],4:[60,34,6],5:[58,36,6],6:[58,36,6],7:[58,36,6]}[hi]):[80,20];   // v2.42：高层沿用 58/36/6；保底仍由实际掉落累计

function fuseInfo(slot){

function salvageInfo(slot){
  const lo=dropBand(S.floor)[0];   // v2.0：掉落区间驱动——楼层不再掉落的品质=过时
  if(lo<=0) return {n:0,v:0};
  let n=0,v=0;
  S.inv.forEach(it=>{ if(it.slot===slot&&it.q<lo&&it.q<4){ n++; v+=Math.round(2*Math.pow(it.q+1,2)*Math.pow(MOB_G,S.floor)); } });
  return {n,v};
}
function salvage(slot){
  if(stageBusy()) return;
  const lo=dropBand(S.floor)[0], info=salvageInfo(slot);
  if(!info.n) return;
  for(let i=S.inv.length-1;i>=0;i--){
    const it=S.inv[i];
    if(it.slot===slot&&it.q<lo&&it.q<4) S.inv.splice(i,1);
  }
  S.gold+=info.v; logEvent("salvage",{slot,count:info.n,value:info.v,reason:"outdated"});
  toast(`拆解低品质装备 ${info.n} 件 → +${fmt(info.v)} 信用点`);
  save(); renderPanels();   // v2.29：从注释尾恢复（v2.24.17 误吞）
}

function salvageAllGold(floor=S.floor){   // 里程碑按刚通关层冻结估值，避免 floor++ 多算一层
  const v=it=>Math.floor(2*Math.pow(it.q+1,2)*Math.pow(1.15,floor)*PRESTIGE_SALVAGE_RATE);
  let g=0, n=0;
  Object.values(S.equip).forEach(it=>{ if(it){ g+=v(it); n++; } });
  S.inv.forEach(it=>{ g+=v(it); n++; });
  return {g,n};
}

// ============ 主循环：游戏时间固定分步，绘制与存档使用现实时间 ============
let lastT=performance.now(), saveTimer=0, autosaveElapsed=0;
function gameClockRunning(){
  return boot.phase==="playing"&&!document.hidden&&!crateAd&&!stageBusy()&&!wall&&!confirmOpen&&!skillOfferOpen&&!S.prestigeOffer&&(!paused||transit);
}
function skillCombatRunning(){
  return gameClockRunning()&&!paused&&!transit&&!enemyEntering&&cur.hp>0&&cur.hp<1e17&&player.hp>0&&
    !$("overlay").classList.contains("show")&&$("stageOverlay").hidden!==false;
}
function combatStep(dt){
  if(!skillCombatRunning())return;
  const st=calcStats();
  atkTimer+=dt*st.aspd;
  // 一次绘制可以结算多次攻击；击杀/受阻/弹窗立即停止，余额不移交下一个敌人。
  let attacks=0;
  while(atkTimer+1e-10>=1&&attacks++<512){
    atkTimer=Math.max(0,atkTimer-1);dealPlayerHit();
    if(cur.hp>=1e17||paused||wall||S.prestigeOffer||stageBusy())return;
  }
  if(cur.hp>=1e17||wall||player.invulnUntil>skillNow())return;
  const dmg=cur.atk*dt;
  if(player.shield>0){const sh=Math.min(player.shield,dmg);player.shield-=sh;player.hp-=dmg-sh;}
  else player.hp-=dmg;
  if(player.hp<=0){checkWall(dt);return;}
  if(isTianshu()){
    cur.phaseT-=dt;
    // 保留跨相位余量；不能用赋值丢掉低帧率/大时间步带来的尾数。
    while(cur.phaseT<=1e-10){
      if(cur.phase===0){cur.phase=1;cur.phaseT+=.5;enemyAnim("charge",500);}
      else if(cur.phase===1){
        cur.phase=2;cur.phaseT+=.5;enemyAnim("cannon",500);
        const burst=cur.atk*2.5;
        if(player.shield>0){const sh=Math.min(player.shield,burst);player.shield-=sh;player.hp-=burst-sh;}
        else player.hp-=burst;
        floatDmg("player",fmt(burst),"#FF2A6D",true);
        if(player.hp<=0){checkWall(dt);return;}
      }else{cur.phase=0;cur.phaseT+=8;}
    }
    if(cur.phase===0&&visualRandom()<dt*1.2){floatDmg("player",fmt(cur.atk),"#FF2A6D",false);enemyAnim("shoot",400);}
  }else if(visualRandom()<dt*1.2){
    floatDmg("player",fmt(cur.atk),"#FF2A6D",false);
    if(isPrism()){prismAlt=!prismAlt;enemyAnim(prismAlt?"shoot":"slash");}
    else if(mobKind==="hound")enemyAnim("bite",500);
    else enemyAnim("shoot",333);
  }
  checkWall(dt);
}
function advanceCombat(realDt){
  if(!gameClockRunning()){combatRemainder=0;return;}
  combatRemainder+=Math.max(0,Math.min(realDt,.1))*effSpeed();
  // 最多48个固定步/正常帧（8×、现实dt上限100ms），没有后台追帧。
  while(combatRemainder+1e-10>=COMBAT_STEP){
    combatRemainder=Math.max(0,combatRemainder-COMBAT_STEP);combatTick++;
    if(skillCombatRunning())skillTick++;
    combatStep(COMBAT_STEP);
    if(!gameClockRunning()){combatRemainder=0;break;}
  }
}
function loop(now){
  const realDt=Math.max(0,Math.min((now-lastT)/1000,.1));lastT=now;
  if(boot.phase!=="playing"||document.hidden){combatRemainder=0;requestAnimationFrame(loop);return;}
  if(stageBusy())paused=true;
  advanceCrateClock(realDt); // 在线现实时间，普通2×与测试4×/8×均不加速补给
  syncPresentationSpeed();
  if(testSpeed===1&&S.speed2&&S.floor>S.bestEver&&!speedDropNotified){speedDropNotified=true;toast("已进入未探索楼层，恢复常速");}
  if(S.floor<=S.bestEver)speedDropNotified=false;
  advanceCombat(realDt);
  saveTimer+=realDt;
  if(saveTimer>=.5){saveTimer%=.5;try{renderPanels();if(drawerOpen)renderDrawer();}catch(e){}}
  autosaveElapsed+=realDt;
  if(autosaveElapsed>=5){autosaveElapsed%=5;save();}
  renderCombat();requestAnimationFrame(loop);
}

function makeBootAssets(){
  return [...new Set(BOOT_IMAGES)].map(url=>({url,type:"image",state:"pending"})).concat(
    Object.values(UPGRADE_PACKS).map(p=>({url:p.script,api:p.api,type:"script",state:"pending"})),

    Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(link=>({url:link.href,type:"style",link,state:"pending"}))
  );
}
function loadBootAsset(asset){
  return new Promise((resolve,reject)=>{
    let settled=false, image=null, controller=null, cleanup=()=>{};
    const finish=error=>{
      if(settled) return; settled=true; clearTimeout(timer); cleanup();
      if(error){ controller?.abort(); if(image) image.src=""; reject(error); }
      else resolve();
    };
    const timer=setTimeout(()=>finish(new Error("素材加载超时")),20000);
    if(asset.type==="image"){
      image=new Image();
      cleanup=()=>{image.onload=null;image.onerror=null;};
      image.onload=async()=>{
        try{ if(image.decode) await image.decode(); if(!settled){asset.image=image;finish();} }
        catch(error){finish(error);}
      };
      image.onerror=()=>finish(new Error("图片加载失败"));
      image.src=asset.url;
    } else if(asset.type==="script"){
      if(window[asset.api]){finish();return;}
      const script=document.createElement("script");
      script.onload=()=>finish(window[asset.api]?null:new Error("改装演出未就绪"));
      script.onerror=()=>finish(new Error("改装演出加载失败"));
      cleanup=()=>{script.onload=null;script.onerror=null;script.remove();};
      script.src=asset.url;document.head.appendChild(script);
    } else if(asset.type==="audio"){
      // 完整下载后复用本地 Blob，避免移动端等待自动播放许可而卡住加载。
      controller=new AbortController();
      fetch(asset.url,{signal:controller.signal}).then(response=>{
        if(!response.ok) throw new Error("音效加载失败"); return response.blob();
      }).then(blob=>{
        if(settled) return;
        if(!blob.size) throw new Error("音效为空");
        boot.audioUrl=URL.createObjectURL(blob);
        sfxPool.forEach(a=>{a.src=boot.audioUrl;a.load();}); finish();
      }).catch(finish);
    } else {
      const link=asset.link;
      if(link.sheet){finish();return;}
      const loaded=()=>finish(), failed=()=>finish(new Error("样式加载失败"));
      link.addEventListener("load",loaded); link.addEventListener("error",failed);
      cleanup=()=>{link.removeEventListener("load",loaded);link.removeEventListener("error",failed);};
      // 脚本运行前已失败的样式也能重试；保留原节点和 CSS 层叠顺序。
      const url=new URL(asset.url,document.baseURI); url.searchParams.set("loadAttempt",String(asset.attempts)); link.href=url.href;
    }
  });
}
function updateLoadingUI(message){
  if(boot.phase!=="loading") return;
  const ready=boot.assets.filter(a=>a.state==="ready").length;
  const percent=boot.assets.length?Math.floor(ready/boot.assets.length*100):0;
  $("loadingFill").style.width=percent+"%";
  $("loadingPercent").textContent=percent+"%";
  $("loadingProgress").setAttribute("aria-valuenow",String(percent));
  if(message) $("loadingStatus").textContent=message;
}
function prepareAssets(){
  if(boot.batch) return boot.batch;
  if(!boot.assets.length) boot.assets=makeBootAssets();
  const queue=boot.assets.filter(a=>a.state!=="ready");
  async function worker(){
    while(queue.length){
      const asset=queue.shift(); asset.state="loading"; asset.attempts=(asset.attempts||0)+1;
      try{ await loadBootAsset(asset); asset.state="ready"; }
      catch(error){asset.state="failed";}
      updateLoadingUI();
    }
  }
  boot.batch=Promise.all(Array.from({length:Math.min(6,queue.length)},worker)).finally(()=>{boot.batch=null;});
  return boot.batch;
}
async function startCoverLoad(reset=false){
  if(boot.phase!=="cover"&&boot.phase!=="failed") return;
  if(saveBlocked&&!reset){toast("存档暂不可读取，请先导出备份，或在设置中明确清除后重新开始。");return;}
  boot.phase="loading"; boot.resetRequested=reset; paused=true;
  const cover=$("cover"), panel=$("coverLoading");
  cover.classList.add("loading"); $("coverSettings").classList.remove("show");
  $("btnStart").disabled=true; $("btnLoadRetry").hidden=true;
  panel.hidden=false; panel.setAttribute("aria-busy","true"); panel.focus({preventScroll:true});
  updateLoadingUI("正在准备战斗素材…");
  boot.slowTimer=setTimeout(()=>updateLoadingUI("加载较慢，请稍候…"),8000);
  await prepareAssets();
  clearTimeout(boot.slowTimer);
  panel.setAttribute("aria-busy","false");
  if(boot.assets.some(a=>a.state!=="ready")){
    updateLoadingUI("部分素材加载失败，请重试"); boot.phase="failed";
    $("btnLoadRetry").hidden=false; $("btnLoadRetry").focus({preventScroll:true}); return;
  }
  updateLoadingUI("准备完成"); boot.phase="entering";
  // 给 100% 一次实际绘制机会，随后直接淡出，不加入假倒计时。
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    cover.classList.add("hide");

      if(resetting&&doReset()===false){

      if(!resetting) openingRunIn();
      if(!S.prestigeOffer&&!S.stageUpgrade){$("btnSpeed").focus({preventScroll:true});}
    },matchMedia("(prefers-reduced-motion: reduce)").matches?0:450);
  }));
}

let logDirHandle=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("neonHunterFS",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  try{ const db=await idbOpen();
    return new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); });
  }catch(e){ return null; }
}
async function idbSet(k,v){
  try{ const db=await idbOpen();
    return new Promise(res=>{ const q=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      q.onsuccess=()=>res(); q.onerror=()=>res(); });
  }catch(e){}
}
async function ensureLogDir(){
  if(!window.showDirectoryPicker) return null;
  if(!logDirHandle) logDirHandle=await idbGet("logDir");
  if(logDirHandle){
    if(await logDirHandle.queryPermission({mode:"readwrite"})==="granted") return logDirHandle;
    if(await logDirHandle.requestPermission({mode:"readwrite"})==="granted") return logDirHandle;
  }
  return null;
}

function tsName(d){

    toast("解锁记录保存失败，尚未清除进度。");return false;
  }
  const resetState=freshState();
  try{localStorage.setItem(saveKey(),JSON.stringify(resetState));}
  catch(e){toast("清除存档失败，原进度已保留。请检查浏览器存储。");return false;}
  prestigeAd=null; crateAd=null;crateAdSerial++;setPresentationHidden(document.hidden);adRelease(); pendingTransit=false; S.prestigeOffer=null;
  confirmOpen=false; pendingSkillOffer=null;   // v2.31：确认复位则丢弃挂起的技能请求
  skillOfferOpen=false; curOffer=[]; S.pendingOffer=null; closeModal();   // v2.29：复位清理技能弹窗流程态
  // v2.31.5：R01——复位清理恢复标记+战斗临时态，显式满血满盾清零
  player.hp=100; player.shield=0;   // 基础血量（新档升级清零，spawnMob 进层按 calcStats 回满） buff={adrenaline:0,critsurge:0,soulrush:0};
  player.pendingInvuln=0;player.invulnUntil=0;syncPlayerInvulnVisual();
  if(stageClock.raf!=null)cancelAnimationFrame(stageClock.raf);
  stageClock={id:null,elapsed:0,last:null,savedAt:0,raf:null};
  $("stageOverlay").hidden=true;document.body.classList.remove("stage-active");setStageInert(false);
  saveBlocked=false;boot.resetRequested=false;
  S=resetState;clearDropNotice();
  wall=false; paused=false;
  buff={adrenaline:0,critsurge:0,soulrush:0};
  floorGoldEarned=0;
  newSession();
  spawnMob(); closeModal(); openingRunIn();   // v2.14：复位后双方跑入
  renderPanels(); renderDrawer();
  saveLogs(true); save();
  toast("已完全复位，新测试段 "+curSession.id+" 开始");
  return true;
}
function endTest(){
  if(stageBusy()||crateAd) return;
  if(!curSession) return;
  curSession.endedAt=Date.now();
  logEvent("session_end",{maxFloor:S.maxFloor});
  sessions.push(curSession);
  if(sessions.length>3) sessions=sessions.slice(-3);   // v2.6：浏览器端只保留最新 3 段（磁盘 logs/ 文件不受影响）
  const sealed=curSession;
  newSession();           // 静默开启新段，游戏继续
  const html=summarize(sealed);
  saveLogs(true);
  saveSessionToFolder(sealed);   // 自动落盘 JSON + CSV 到 logs/ 文件夹（首次弹授权）
  saveCsvToFolder(sealed);
  showModal("⏹️ 测试段 "+sealed.id+" 已封存", html,
    `<button class="gold" onclick="closeModal();saveSessionToFolder(findSession('${sealed.id}'))">存入 logs 文件夹</button>
     <button class="gold" onclick="closeModal();exportCSV('${sealed.id}')">导出楼层 CSV</button>
     <button onclick="closeModal()">继续游戏</button>`);
  renderDrawer();
}
function summarize(s){
  const durMin=((s.endedAt-s.startedAt)/60000);
  const maxF=s.floors.length?s.floors[s.floors.length-1].floor:0;
  const walls=s.events.filter(e=>e.type==="wall");
  const ups=s.events.filter(e=>e.type==="upgrade");
  const upsAtk=ups.filter(e=>e.kind==="atk").length, upsHp=ups.filter(e=>e.kind==="hp").length;
  const sk=s.events.filter(e=>e.type==="skill");
  const pr=s.events.filter(e=>e.type==="prestige");
  const ads=s.events.filter(e=>e.type==="prestige"&&e.mult===2).length;
  const crates=s.events.filter(e=>e.type==="crate").length;
  const drops=s.events.filter(e=>e.type==="drop");
  let wallLine="本次未卡关";
  if(walls.length){
    const w=walls[0], inTarget=w.snap.floor>=25&&w.snap.floor<=40;
    wallLine=`首卡：第 ${w.snap.floor} 层 / ${(w.t/60000).toFixed(1)} 分钟
      （设计目标 25~40 层 ${inTarget?"✅":"⚠️ 偏离"}，原因：${w.reason==="hp_zero"?"站不住":"击杀超时"}）`;
  }
  return `时长 <b>${durMin.toFixed(1)}</b> 分钟 · 通过 <b>${maxF}</b> 层 · 事件 <b>${s.events.length}</b> 条<br>
    ${wallLine}<br>
    强化 <b>${ups.length}</b> 次（攻 ${upsAtk} / 血 ${upsHp}）· 爆装 <b>${drops.length}</b> 件 ·
    技能 <b>${sk.length}</b> 次<br>
    重塑 <b>${pr.length}</b> 次 · 广告按钮点击 <b>${ads}</b> 次 · 补给箱 <b>${crates}</b> 次<br>
    <small>新测试段 ${curSession.id} 已静默开启</small>`;
}

// ---- 导出 ----
function findSession(id){ return id===curSession.id?curSession:sessions.find(x=>x.id===id); }
function download(name,content,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(id){
  const s=findSession(id); if(!s) return;
  saveSessionToFolder(s);
}
function exportCSV(id){
  const s=findSession(id); if(!s) return;
  saveCsvToFolder(s);
}

function toggleDrawer(){
  drawerOpen=!drawerOpen;
  document.getElementById("drawer").classList.toggle("show",drawerOpen);
  $("btnCrate").disabled=!canOpenCrate();
  if(drawerOpen) renderDrawer();
}
function renderDrawer(){
  const body=document.getElementById("drawerBody");
  if(!body) return;
  let html="";
  if(curSession){
    const dur=((Date.now()-curSession.startedAt)/60000).toFixed(1);
    html+=`<div class="sess current"><b>▶ 当前段 ${curSession.id}</b> <span style="color:#5a6472">${curSession.build}${curSession.testSpeedUsed?" · 测试倍速样本":""}</span>
      <div class="meta">时长 ${dur} 分钟 · 事件 ${curSession.events.length} 条 · 已过 ${curSession.floors.length} 层</div>
      <button class="gold" onclick="saveSessionToFolder(curSession)">💾 存到文件夹</button>
      <button class="gold" onclick="exportCSV('${curSession.id}')">CSV</button></div>`;
  }
  html+=[...sessions].slice(-3).reverse().map(s=>{   // v2.6：界面也只显示最新 3 段
    const dur=((s.endedAt-s.startedAt)/60000).toFixed(1);
    const maxF=s.floors.length?s.floors[s.floors.length-1].floor:0;
    const w=s.events.find(e=>e.type==="wall");
    return `<div class="sess"><b>${s.id}</b> <span style="color:#5a6472">${s.build}</span>
      <div class="meta">${dur} 分钟 · 过 ${maxF} 层 · ${s.events.length} 事件${w?` · 首卡 ${w.snap.floor} 层`:""}</div>
      <button class="gold" onclick="saveSessionToFolder(findSession('${s.id}'))">💾 存到文件夹</button>
      <button class="gold" onclick="exportCSV('${s.id}')">CSV</button></div>`;
  }).join("");
  body.innerHTML=html||'<div class="meta" style="color:var(--dim)">暂无测试段</div>';
}

document.addEventListener("keydown",e=>{
  if(e.key!=="Tab"||(!S.prestigeOffer&&!skillOfferOpen)||!$("overlay").classList.contains("show")) return;
  const buttons=Array.from($("modalBox").querySelectorAll("button:not(:disabled)"));
  if(!buttons.length) return;
  const i=buttons.indexOf(document.activeElement);
  if(i<0||(e.shiftKey&&i===0)||(!e.shiftKey&&i===buttons.length-1)){
    e.preventDefault(); buttons[e.shiftKey?buttons.length-1:0].focus();
  }
});
