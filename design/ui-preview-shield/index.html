<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>护盾白色光环效果 · 霓虹猎手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --cyan:#00F0FF; --magenta:#FF2A6D; --dim:#8b95a7; }
  body { background:#1a1d24; font-family:"PingFang SC","Microsoft YaHei",sans-serif; padding:20px;
         display:flex; flex-direction:column; align-items:center; color:#e6edf3; }
  .arena { position:relative; width:860px; height:300px; border-radius:12px; overflow:hidden;
           background:url('arena-bg3.webp') center/cover; }
  .fighter { position:absolute; bottom:60px; width:110px; height:110px; }
  #pF { left:16%; } #eF { right:16%; width:150px; height:150px; bottom:44px; }
  .spr { position:absolute; inset:0; background-repeat:no-repeat; }
  #pF .spr { background-image:url('gunner_idle.png'); background-size:400% 100%; }
  #eF .spr { background-image:url('warden_idle.png'); background-size:400% 100%; }
  /* ★ 护盾方案：白色剪影光环层（原图复制 → 纯白剪影 → 模糊发光 → 垫在原图后） */
  .aura { position:absolute; inset:-18%; background-repeat:no-repeat; background-size:inherit;
          filter:brightness(0) invert(1) blur(10px); opacity:.85; z-index:-1;
          animation:auraBreath 1.6s ease-in-out infinite; }
  @keyframes auraBreath { 0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.06);opacity:1} }
  #pF .aura { background-image:url('gunner_idle.png'); }
  #eF .aura { background-image:url('warden_idle.png'); }
  .bar { position:absolute; bottom:36px; width:180px; height:13px; background:#1a2436;
         border:1px solid #2b3a55; border-radius:7px; overflow:hidden; }
  .bar .fill { height:100%; }
  #pB { left:calc(16% - 20px); } #pB .fill { width:80%; background:var(--cyan); }
  #eB { right:calc(16% - 20px); } #eB .fill { width:100%; background:var(--magenta); }
  .sh { position:absolute; bottom:52px; width:180px; height:8px; background:#141c2c;
        border:1px solid #2b3a55; border-radius:3px; overflow:hidden; }
  .sh .fill { height:100%; background:linear-gradient(90deg,#9fd8ff,#e8f4ff); }
  #pS { left:calc(16% - 20px); } #pS .fill { width:60%; }
  #eS { right:calc(16% - 20px); } #eS .fill { width:100%; }
  .tag-new { position:absolute; font-size:11px; color:#FFD166; text-shadow:0 1px 3px #000; }
  .vs { display:flex; gap:16px; margin-top:16px; }
  .card { background:#111827; border:1px solid #1e2a44; border-radius:10px; padding:12px 16px;
          font-size:12px; line-height:1.9; color:#cfd8e3; width:420px; }
  .card b { color:var(--cyan); }
</style>
</head>
<body>
<div class="arena">
  <div class="fighter" id="pF"><div class="aura"></div><div class="spr"></div></div>
  <div class="fighter" id="eF"><div class="aura"></div><div class="spr"></div></div>
  <div class="sh" id="pS"><div class="fill"></div></div>
  <div class="bar" id="pB"><div class="fill"></div></div>
  <div class="sh" id="eS"><div class="fill"></div></div>
  <div class="bar" id="eB"><div class="fill"></div></div>
  <div class="tag-new" style="left:16%;bottom:170px">玩家：护盾 → 白色呼吸光环</div>
  <div class="tag-new" style="right:16%;bottom:220px;text-align:right">Boss：红光 → 白色光环<br>（原红色光晕为素材内建，此处演示白化方案）</div>
</div>
<div class="vs">
  <div class="card">
    <b>方案：白色剪影光环层</b><br>
    · 原精灵图复制一层 → <code>brightness(0) invert(1)</code> 纯白剪影 → 模糊 10px → 垫在原图后<br>
    · 呼吸动画 1.6s（明暗+微缩放），无盾时整层移除<br>
    · 玩家/Boss 同一机制同一实现（.aura 类按盾值挂载）
  </div>
  <div class="card">
    <b>与旧方案对比</b><br>
    · 取消：白色轮扩描边环（v2.19.3 的 ::after 脉冲圈）<br>
    · 新方案贴合角色轮廓发光，与素材内建光晕（如典狱长红光）气质一致<br>
    · 盾条数值显示保留不变
  </div>
</div>
</body>
</html>
