<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>倍速按钮位置参考 · 霓虹猎手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --cyan:#00F0FF; --magenta:#FF2A6D; --gold:#FFD166; --bg:#0a0e17; --dim:#8b95a7; }
  body { background:#1a1d24; font-family:"PingFang SC","Microsoft YaHei",sans-serif; padding:20px;
         display:flex; flex-direction:column; align-items:center; color:#e6edf3; }
  .arena { position:relative; width:860px; height:280px; border-radius:12px; overflow:hidden;
           background:linear-gradient(180deg,#141b2e 0%,#1d2440 55%,#2a2140 56%,#1a1428 100%); }
  .hud { position:absolute; top:8px; left:50%; transform:translateX(-50%);
         background:rgba(10,14,23,.72); border:1px solid #1e2a44; border-radius:20px;
         padding:5px 16px; font-size:14px; }
  .hud b { color:var(--gold); } .hud .ps { color:#c07bff; }
  .fl { position:absolute; top:10px; left:14px; }
  .fl .big { font-size:22px; font-weight:700; text-shadow:0 0 10px rgba(0,240,255,.5); }
  .fl .big b { color:var(--cyan); font-size:26px; }
  .fl .sub { font-size:10px; color:var(--dim); }
  .mobp { position:absolute; top:12px; right:12px; font-size:11px; color:var(--dim); }
  .fighter { position:absolute; bottom:74px; font-size:40px; }
  #pF { left:22%; } #eF { right:22%; }
  .bar { position:absolute; bottom:56px; width:180px; height:14px; background:#1a2436;
         border:1px solid #2b3a55; border-radius:7px; overflow:hidden; }
  .bar .fill { height:100%; }
  #pB { left:calc(22% - 58px); } #pB .fill { width:80%; background:var(--cyan); }
  #eB { right:calc(22% - 58px); } #eB .fill { width:55%; background:var(--magenta); }
  /* ★ 倍速按钮：战斗区左下角，楼层号下方 */
  .speedbtn { position:absolute; left:14px; bottom:14px; z-index:3;
              background:rgba(10,14,23,.8); border:1px solid var(--cyan); color:var(--cyan);
              border-radius:18px; padding:6px 14px; font-size:13px; cursor:pointer;
              box-shadow:0 0 8px rgba(0,240,255,.25); }
  .speedbtn.off { border-color:#2b3a55; color:var(--dim); box-shadow:none; }
  .speedbtn small { color:var(--dim); font-size:10px; }
  .tag-new { position:absolute; left:150px; bottom:20px; font-size:10px; color:var(--gold); }
  .note { max-width:860px; margin-top:14px; font-size:13px; line-height:2; color:#cfd8e3; }
  .note b { color:var(--gold); }
</style>
</head>
<body>
<div class="arena">
  <div class="fl"><div class="big">第 <b>8</b> 层</div><div class="sub">数据机房 · 下一层：维修层</div></div>
  <div class="hud">💰 <b>1.2K</b> · 🌌 <span class="ps"><b>15</b></span></div>
  <div class="mobp">◾◾◾◽◽ 3/5</div>
  <div class="fighter" id="pF">🔫</div>
  <div class="fighter" id="eF">🐺</div>
  <div class="bar" id="pB"><div class="fill"></div></div>
  <div class="bar" id="eB"><div class="fill"></div></div>
  <!-- ★ 新位置：战斗区左下角 -->
  <button class="speedbtn">⏩ 2× <small>已通过楼层</small></button>
  <div class="tag-new">↑ 倍速按钮新位置（首次重塑后才出现）</div>
</div>
<div class="note">
  <b>规则</b><br>
  · <b>首次重塑前不显示</b>（二轮回合才存在"已通过楼层"，此前按钮无意义）<br>
  · 位置：战斗区<b>左下角</b>（楼层号下方，不挡战斗、不挤顶栏）<br>
  · 开：青色描边发光「⏩ 2×」；关：灰色「⏩ 1×」；边境自动常速时副标变「边境常速」<br>
  · 顶栏恢复原三键（复位/结束测试/日志）
</div>
</body>
</html>
